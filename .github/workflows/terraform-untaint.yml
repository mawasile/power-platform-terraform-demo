name: Terraform untaint

# Clears the tainted flag left by a failed apply so the next plan does not
# propose destroying and recreating resources that actually exist.
# This workflow never applies changes; review the next plan afterwards.
on:
  workflow_dispatch:
    inputs:
      addresses:
        description: Resource addresses to untaint, one per line
        type: string
        required: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.16.2"

defaults:
  run:
    shell: bash
    working-directory: infra

jobs:
  untaint:
    name: Untaint resources
    if: github.repository == 'mawasile/power-platform-terraform-demo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: infrastructure
    permissions:
      contents: read
      id-token: write
    # Share the deployment lock: one writer at a time against the single state.
    concurrency:
      group: terraform-infrastructure
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      POWER_PLATFORM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      POWER_PLATFORM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Initialize remote state with OIDC
        run: |
          terraform init -input=false -lockfile=readonly -no-color \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_STATE_CONTAINER"

      # Addresses arrive as untrusted input: validate before use, never interpolate into the script.
      - name: Untaint the requested resources
        env:
          ADDRESSES: ${{ inputs.addresses }}
        run: |
          count=0
          while IFS= read -r address; do
            address="$(echo "$address" | tr -d '[:space:]')"
            [[ -z "$address" ]] && continue
            if [[ ! "$address" =~ ^module\.[A-Za-z0-9_.]+\.[A-Za-z0-9_]+\.[A-Za-z0-9_]+(\[\"[A-Za-z0-9_-]+\"\])?$ ]]; then
              echo "::error::Refusing unexpected resource address."
              exit 1
            fi
            terraform untaint -no-color -allow-missing -lock-timeout=5m "$address"
            count=$((count + 1))
          done <<< "$ADDRESSES"
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No resource address supplied."
            exit 1
          fi
          echo "Untainted resources: $count. Run the Terraform infrastructure workflow to review the next plan."
