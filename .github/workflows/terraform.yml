name: Terraform infrastructure

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "solutions/**"
      - ".github/workflows/terraform.yml"
      - ".github/scripts/**"
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the plan (otherwise plan only)
        type: boolean
        required: true
        default: false
      destroy:
        description: "DANGER: plan a destroy of the environments and access groups instead of applying the configuration"
        type: boolean
        required: true
        default: false
      confirm_destroy:
        description: Type DESTROY to confirm a destroy run
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.16.2"

defaults:
  run:
    shell: bash
    working-directory: infra

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without remote state
        run: terraform init -backend=false -input=false -lockfile=readonly -no-color

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Run mocked tests
        run: terraform test -var-file=infrastructure.tfvars -var-file=config/azure.tfvars -var-file=config/environments.tfvars -var-file=config/solutions.tfvars -var-file=config/tenant.tfvars -no-color

      - name: Test plan safety guard
        run: node --test ../.github/scripts/check-terraform-plan.test.mjs

  deploy:
    name: Plan and deploy
    needs: validate
    if: >-
      github.repository == 'mawasile/power-platform-terraform-demo' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: infrastructure
    permissions:
      contents: read
      id-token: write
    # Every environment shares one state. Never cancel a running apply.
    concurrency:
      group: terraform-infrastructure
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      POWER_PLATFORM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      POWER_PLATFORM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check deployment settings
        env:
          DESTROY_REQUESTED: ${{ inputs.destroy == true }}
          DESTROY_CONFIRMATION: ${{ inputs.confirm_destroy }}
        run: |
          if [[ "$DESTROY_REQUESTED" == "true" && "$DESTROY_CONFIRMATION" != "DESTROY" ]]; then
            echo "::error::Destroy requires typing DESTROY in the confirmation input."
            exit 1
          fi
          for name in ARM_CLIENT_ID ARM_TENANT_ID TF_STATE_STORAGE_ACCOUNT TF_STATE_CONTAINER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name. See infra/README.md for repository setup."
              exit 1
            fi
          done
          test -f infrastructure.tfvars
          test -f config/azure.tfvars
          test -f config/environments.tfvars
          test -f config/solutions.tfvars
          test -f config/tenant.tfvars

      - name: Initialize remote state with OIDC
        run: |
          terraform init -input=false -lockfile=readonly -no-color \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_STATE_CONTAINER"

      - name: Validate configuration
        run: terraform validate -no-color

      # The value never appears in tfvars or logs; only the masked JSON is passed on.
      - name: Build solution secret values
        if: inputs.destroy != true
        id: solution_secrets
        env:
          MAGIC_NUMBER_PROD: ${{ secrets.MAGIC_NUMBER_PROD }}
        run: |
          if [[ -z "$MAGIC_NUMBER_PROD" ]]; then
            echo "::error::Missing MAGIC_NUMBER_PROD. See infra/README.md for repository setup."
            exit 1
          fi
          json=$(jq -n --arg prod "$MAGIC_NUMBER_PROD" \
            '{TerrraformExampleSolution: {prod: {bal_MagicNumber: $prod}}}')
          echo "::add-mask::$json"
          echo "json=$json" >> "$GITHUB_OUTPUT"

      - name: Plan committed infrastructure
        if: inputs.destroy != true
        env:
          TF_VAR_solution_secrets: ${{ steps.solution_secrets.outputs.json }}
        run: terraform plan -input=false -no-color -lock-timeout=5m -var-file=infrastructure.tfvars -var-file=config/azure.tfvars -var-file=config/environments.tfvars -var-file=config/solutions.tfvars -var-file=config/tenant.tfvars -out=deployment.tfplan

      # Targets exclude module.tenant: its settings are protected by prevent_destroy
      # and removing them would restore pre-management values tenant-wide.
      - name: Plan destroy
        if: inputs.destroy == true
        run: |
          terraform plan -destroy -input=false -no-color -lock-timeout=5m \
            -var-file=infrastructure.tfvars \
            -var-file=config/azure.tfvars \
            -var-file=config/environments.tfvars \
            -var-file=config/solutions.tfvars \
            -var-file=config/tenant.tfvars \
            -target=module.solutions \
            -target=module.power_platform \
            -target=module.azure \
            -out=deployment.tfplan

      - name: Check the plan against the requested operation
        env:
          DESTROY_REQUESTED: ${{ inputs.destroy == true }}
        run: |
          # Pipefail also blocks apply if Terraform cannot produce the plan JSON.
          terraform show -json deployment.tfplan | node ../.github/scripts/check-terraform-plan.mjs

      - name: Apply the saved plan
        if: github.event_name == 'push' || inputs.apply == true
        run: terraform apply -input=false -no-color -lock-timeout=5m deployment.tfplan

      # Plans may contain sensitive values. Keep them only on this runner.
      - name: Remove saved plan
        if: always()
        run: rm -f deployment.tfplan