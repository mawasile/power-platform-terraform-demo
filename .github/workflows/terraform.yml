name: Terraform infrastructure

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
      - ".github/scripts/**"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
      - ".github/scripts/**"
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the plan (otherwise plan only)
        type: boolean
        required: true
        default: false
      delete_demo_dlp:
        description: Delete only the three retired demo DLP policies (requires apply)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.16.2"

defaults:
  run:
    shell: bash
    working-directory: infra

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      # PR code receives neither cloud credentials nor an OIDC token permission.
      - name: Initialize without remote state
        run: terraform init -backend=false -input=false -lockfile=readonly -no-color

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Run mocked tests
        run: terraform test -var-file=infrastructure.tfvars -no-color

      - name: Test plan safety guard
        run: node --test ../.github/scripts/check-terraform-plan.test.mjs

  deploy:
    name: Plan and deploy
    needs: validate
    if: >-
      github.repository == 'mawasile/power-platform-terraform-demo' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: infrastructure
    permissions:
      contents: read
      id-token: write
    # All three environments share one state. Never cancel a running apply.
    concurrency:
      group: terraform-infrastructure
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      POWER_PLATFORM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      POWER_PLATFORM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check deployment settings
        env:
          CLEANUP_REQUESTED: ${{ inputs.delete_demo_dlp == true }}
          APPLY_REQUESTED: ${{ inputs.apply == true }}
        run: |
          if [[ "$CLEANUP_REQUESTED" == "true" && "$APPLY_REQUESTED" != "true" ]]; then
            echo "::error::Demo DLP deletion requires explicit apply confirmation."
            exit 1
          fi
          for name in ARM_CLIENT_ID ARM_TENANT_ID TF_STATE_STORAGE_ACCOUNT TF_STATE_CONTAINER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name. See infra/README.md for repository setup."
              exit 1
            fi
          done
          test -f infrastructure.tfvars

      - name: Initialize remote state with OIDC
        run: |
          terraform init -input=false -lockfile=readonly -no-color \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_STATE_CONTAINER"

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Plan committed infrastructure
        run: terraform plan -input=false -no-color -lock-timeout=5m -var-file=infrastructure.tfvars -out=deployment.tfplan

      - name: Block deletions and replacements
        env:
          ALLOW_DEMO_DLP_DELETION: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true && inputs.delete_demo_dlp == true }}
        run: |
          # Pipefail also blocks apply if Terraform cannot produce the plan JSON.
          terraform show -json deployment.tfplan | node ../.github/scripts/check-terraform-plan.mjs

      - name: Apply the saved plan
        if: github.event_name == 'push' || inputs.apply == true
        run: terraform apply -input=false -no-color -lock-timeout=5m deployment.tfplan

      # Plans may contain sensitive values. Keep them only on this runner.
      - name: Remove saved plan
        if: always()
        run: rm -f deployment.tfplan